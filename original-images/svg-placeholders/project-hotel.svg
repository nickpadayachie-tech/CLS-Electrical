<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a38"/>
      <stop offset="1" stop-color="#1d2f5e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#0d1b3d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g stroke="#4d84ff" stroke-opacity="0.14" fill="none">
    <path d="M-100 620 L1300 240"/>
    <path d="M-100 690 L1300 330"/>
    <path d="M-100 760 L1300 420"/>
  </g>
  <!-- skyscrapers -->
  <rect x="180" y="260" width="150" height="480" fill="#0d1530" stroke="#2f6bff" stroke-opacity="0.35"/>
  <rect x="360" y="200" width="190" height="540" fill="#111a3c" stroke="#2f6bff" stroke-opacity="0.35"/>
  <rect x="590" y="300" width="160" height="440" fill="#0c132c" stroke="#2f6bff" stroke-opacity="0.35"/>
  <rect x="800" y="230" width="200" height="510" fill="#131d42" stroke="#2f6bff" stroke-opacity="0.35"/>
  <!-- window grids -->
  <g fill="#4d84ff" fill-opacity="0.5">
    <circle cx="200" cy="300" r="3"/><circle cx="230" cy="300" r="3"/><circle cx="260" cy="300" r="3"/><circle cx="290" cy="300" r="3"/>
    <circle cx="200" cy="360" r="3"/><circle cx="230" cy="360" r="3"/><circle cx="260" cy="360" r="3"/><circle cx="290" cy="360" r="3"/>
    <circle cx="200" cy="420" r="3"/><circle cx="230" cy="420" r="3"/><circle cx="260" cy="420" r="3"/><circle cx="290" cy="420" r="3"/>
  </g>
  <g fill="#4d84ff" fill-opacity="0.5">
    <circle cx="400" cy="250" r="3"/><circle cx="450" cy="250" r="3"/><circle cx="500" cy="250" r="3"/><circle cx="400" cy="310" r="3"/><circle cx="450" cy="310" r="3"/><circle cx="500" cy="310" r="3"/><circle cx="400" cy="370" r="3"/><circle cx="450" cy="370" r="3"/><circle cx="500" cy="370" r="3"/>
  </g>
  <g fill="#4d84ff" fill-opacity="0.5">
    <circle cx="850" cy="280" r="3"/><circle cx="900" cy="280" r="3"/><circle cx="950" cy="280" r="3"/><circle cx="850" cy="340" r="3"/><circle cx="900" cy="340" r="3"/><circle cx="950" cy="340" r="3"/><circle cx="850" cy="400" r="3"/><circle cx="900" cy="400" r="3"/><circle cx="950" cy="400" r="3"/>
    <circle cx="850" cy="460" r="3"/><circle cx="900" cy="460" r="3"/><circle cx="950" cy="460" r="3"/>
  </g>
  <!-- antenna lines (electrical motif) -->
  <g stroke="#2f6bff" stroke-width="2" stroke-opacity="0.8">
    <line x1="455" y1="200" x2="455" y2="150"/>
    <line x1="455" y1="150" x2="430" y2="120"/>
    <line x1="455" y1="150" x2="480" y2="120"/>
    <line x1="900" y1="230" x2="900" y2="170"/>
    <line x1="900" y1="170" x2="875" y2="140"/>
    <line x1="900" y1="170" x2="925" y2="140"/>
  </g>
  <!-- landscape glow -->
  <rect y="700" width="1200" height="50" fill="#0a1026"/>
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#2f6bff" stroke-opacity="0.4"/>
</svg>
